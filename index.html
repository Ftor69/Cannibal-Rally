<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CANNIBAL RALLY</title><link rel="stylesheet" href="/src/style.css"></head><body><canvas id="game" tabindex="0" aria-label="Игровое поле. E — сесть в багги; WASD или стрелки — управление."></canvas><header><small>ОСТРОВ 01 · ОДИНОЧНЫЙ РЕЖИМ</small><h1>CANNIBAL<span> RALLY</span></h1><p>Выживи. Почини. Доберись.</p></header><aside id="status"></aside><div id="race"></div><div id="hint" role="status"></div><nav id="controls" aria-label="Управление игрой"><button data-action="KeyE">Сесть в багги · E</button><div class="drive-pad"><button data-drive="KeyW" aria-label="Газ или движение вперёд">↑</button><button data-drive="KeyA" aria-label="Поворот влево">←</button><button data-drive="Space" aria-label="Тормоз">Стоп</button><button data-drive="KeyD" aria-label="Поворот вправо">→</button><button data-drive="KeyS" aria-label="Задний ход">↓</button></div><div class="service-buttons"><button data-action="KeyF">Ремонт</button><button data-action="KeyG">Топливо</button><button data-action="Enter">Заново</button></div></nav><footer><b>WASD / стрелки</b> движение · <b>Space</b> тормоз · <b>E</b> сесть / выйти · <b>F</b> ремонт · <b>G</b> заправка · <b>H</b> еда · <b>R</b> гонка · <b>Enter</b> новая игра<p>Ремонт и заправка — у лагеря. Оранжевые ворота — маршрут без лимита времени.</p></footer><div id="message" role="status"></div><script type="module" src="/src/main.js"></script></body></html>
